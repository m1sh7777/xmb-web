<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07559e">
  <meta name="description" content="A small educational recreation of the PSP XrossMediaBar, built with HTML, CSS and vanilla JavaScript.">
  <title>PSP XMB — Web Recreation</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <canvas id="waves" aria-hidden="true"></canvas>
  <div id="viewport">
    <div id="console">
      <header><time id="clock" aria-label="Current date and time"></time></header>
      <main id="home" aria-label="XrossMediaBar">
        <nav id="categories" aria-label="Categories"></nav>
        <div id="menu" role="menu" aria-label="Music"></div>
      </main>
      <section id="panel" aria-labelledby="panel-title" hidden>
        <h1 id="panel-title"></h1>
        <p id="panel-description"></p>
        <div id="themes" role="group" aria-label="Background theme" hidden></div>
      </section>
      <footer>
        <button id="enter"><span aria-hidden="true">×</span> Enter</button>
        <button id="back"><span aria-hidden="true">○</span> Back</button>
      </footer>
    </div>
  </div>
  <section id="rotate" aria-label="Rotate your device">
    <p>Rotate your device</p>
    <small>Explore the XMB in landscape.</small>
  </section>
</body>
</html>
